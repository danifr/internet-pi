---
- name: Synchronize internet-monitoring directory.
  ansible.posix.synchronize:
    src: internet-monitoring
    dest: "{{ config_dir }}/"
    delete: false
    recursive: true
    perms: false
  become: false

# This is an upgrade task from 1.x to 2.x - can be removed for 3.x.
- name: Ensure internet-monitoring directory is not a Git repository.
  ansible.builtin.file:
    path: "{{ config_dir }}/internet-monitoring/.git/"
    state: absent
  become: false

- name: Copy templated internet-monitoring files into place.
  ansible.builtin.template:
    src: templates/{{ item.src }}
    dest: "{{ config_dir }}/internet-monitoring/{{ item.dest }}"
    mode: 0644
  loop:
    - src: docker-compose.yml.j2
      dest: docker-compose.yml
    - src: grafana-config.monitoring.j2
      dest: grafana/config.monitoring
    - src: prometheus.yml.j2
      dest: prometheus/prometheus.yml
    - src: prometheus-pinghosts.yaml.j2
      dest: prometheus/pinghosts.yaml
  notify: Restart internet-monitoring
  become: false

# Vendored from eko/pihole-exporter v1.2.0; update this file manually when upgrading the exporter.
- name: Copy pihole-exporter dashboard to Grafana.
  ansible.builtin.copy:
    src: files/pihole-exporter.json
    dest: "{{ config_dir }}/internet-monitoring/grafana/provisioning/dashboards/pihole-exporter.json"
    mode: 0644
  notify: Restart internet-monitoring
  become: false
  when: pihole_enable

- name: Copy raspberry-monitoring dashboard config to grafana
  ansible.builtin.copy:
    src: files/raspberry-monitoring.json
    dest: "{{ config_dir }}/internet-monitoring/grafana/provisioning/dashboards/"
    mode: 0644
  notify: Restart internet-monitoring
  become: false
  when: raspberry_monitoring_enable

- name: Ensure internet-monitoring environment is running.
  community.docker.docker_compose_v2:
    project_src: "{{ config_dir }}/internet-monitoring/"
    build: never
  become: false
